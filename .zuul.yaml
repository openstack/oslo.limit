---
- job:
    name: oslo-limit-functional-devstack
    parent: devstack-tox-functional
    description:
      This job sets up a minimal devstack deployment and verify the behavior
      against the real APIs.
    vars:
      devstack_services:
        # Ignore all services by setting "disable_all_service". We do this
        # because we only really need keystone running to store unified limits.
        # These functional tests are not testing enforcement between keystone
        # and other services like nova and cinder. After this, we should only
        # enable exactly what we need to run keystone.
        base: false
        mysql: true
        key: true
    irrelevant-files:
      - ^\.gitignore$
      - ^\.gitreview$
      - ^.*\.rst$
      - ^doc/.*$
      - LICENSE
      - ^releasenotes/.*$
      - ^\.pre-commit-config\.yaml$
      - ^oslo_limit/tests/unit/.*$

- project:
    templates:
      - check-requirements
      - openstack-cover-jobs
      - lib-forward-testing-python3
      - openstack-python3-jobs
      - openstack-python3-next-jobs
      - periodic-stable-jobs
      - publish-openstack-docs-pti
      - release-notes-jobs-python3
    check:
      jobs:
        - oslo-limit-functional-devstack
    gate:
      jobs:
        - oslo-limit-functional-devstack
